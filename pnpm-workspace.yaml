# The library is a standalone package (its own repository). pnpm 11+ does not
# run dependency install scripts without an explicit decision; sibling packages
# of the same author are installed right after they are published.
packages:
  - '.'
allowBuilds:
  # Native file watcher of jest-haste-map (jest 30.5+, --watch mode). Prebuilt binaries ship in the
  # optional @parcel/watcher-<platform> packages; the install script only builds from source with
  # npm_config_build_from_source=true, so nothing is lost without it.
  '@parcel/watcher': false
engineStrict: true
minimumReleaseAgeExclude:
  - '@hoshinotatsuya/arch-gates'
  - '@hoshinotatsuya/node-guard'
